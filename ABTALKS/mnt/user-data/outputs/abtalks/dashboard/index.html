<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Dashboard — ABTalks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/style.css">
</head>
<body>

<nav class="nav">
  <div class="brand"><span class="dot">&gt;_</span>ABTalks</div>
  <div class="row" style="gap:10px;">
    <div class="mono chip on" id="ember-chip" style="display:none;">🔥 <span id="ember-count">0</span> ember</div>
    <div class="mono" style="width:34px;height:34px;border-radius:50%;background:var(--bg-elevated);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;" id="avatar">--</div>
  </div>
</nav>

<main class="shell" style="position:relative; z-index:1; padding-top:20px;" id="app">
  <!-- populated by JS -->
</main>

<script src="../assets/app.js"></script>
<script>
const el = document.getElementById('app');

function emptyProfileNotice(data) {
  if (data.days.filter(d => d.status === 'done' || d.status === 'missed-saved').length > 0) return '';
  return `
    <div class="card" style="margin-bottom:16px; border-color:var(--ember);">
      <p style="font-size:13px; color:var(--text-primary);"><strong>Your streak is empty — for now.</strong> Open today's task below and submit your first proof of work. That's it, Day 1 is done.</p>
    </div>`;
}

loadData().then(data => {
  const s = data.student;
  const day12 = data.day12;
  const todayEntry = data.days.find(d => d.day === s.currentDay);
  const doneToday = todayEntry && (todayEntry.status === 'done' || todayEntry.status === 'missed-saved');
  const daysDone = data.days.filter(d => d.status === 'done' || d.status === 'missed-saved').length;
  const pct = Math.round((daysDone / 60) * 100);
  const earnedBadges = s.badges.filter(b => b.earned);

  document.getElementById('avatar').textContent = s.initials;
  if (s.embers > 0) {
    document.getElementById('ember-chip').style.display = 'inline-flex';
    document.getElementById('ember-count').textContent = s.embers;
  }

  el.innerHTML = `
    <div style="margin-bottom:20px;">
      <div class="eyebrow">${timeGreeting()}</div>
      <h1 style="font-size:22px;">Hey ${s.name.split(' ')[0]}</h1>
      <p style="font-size:13px; margin-top:4px;">${s.college} · ${s.track} track</p>
    </div>

    ${emptyProfileNotice(data)}

    <!-- STREAK CARD -->
    <div class="card" style="margin-bottom:14px;">
      <div class="row" style="align-items:flex-start; margin-bottom:14px;">
        <div>
          <div class="section-title" style="margin-bottom:6px;">Current streak</div>
          <div style="display:flex; align-items:baseline; gap:8px;">
            <span class="mono" style="font-size:40px; font-weight:700; color:var(--ember); line-height:1;">${s.streak}</span>
            <span class="faint" style="font-size:13px;">days 🔥</span>
          </div>
        </div>
        <div style="text-align:right;">
          <div class="section-title" style="margin-bottom:6px;">Longest</div>
          <div class="mono" style="font-size:18px; font-weight:600;">${s.longestStreak}</div>
        </div>
      </div>
      <div class="strip" id="strip"></div>
      <div class="row" style="margin-top:10px; font-size:11px;" class="faint">
        <span class="faint">Day 1</span>
        <span class="faint mono" id="strip-legend">🟧 done · 🟦 shield used · ▢ upcoming</span>
      </div>
    </div>

    <!-- TODAY'S TASK -->
    <div class="card" style="margin-bottom:14px; ${doneToday ? '' : 'border-color:var(--ember);'}">
      <div class="row" style="margin-bottom:10px;">
        <div class="eyebrow" style="margin:0;">Day ${s.currentDay} of 60</div>
        ${doneToday
          ? '<span class="chip" style="background:var(--mint-dim); border-color:var(--mint); color:#c9fff2;">✓ submitted</span>'
          : '<span class="chip on">due tonight</span>'}
      </div>
      <h3 style="font-size:17px; margin-bottom:6px;">${day12.title}</h3>
      <p style="font-size:13px; margin-bottom:16px;">${day12.description}</p>
      <a href="../day/${s.currentDay}/" class="btn ${doneToday ? 'btn-secondary' : 'btn-primary'}">
        ${doneToday ? 'View submission →' : "Open today's task →"}
      </a>
    </div>

    <!-- PROGRESS -->
    <div class="card" style="margin-bottom:14px;">
      <div class="row" style="margin-bottom:10px;">
        <div class="section-title" style="margin:0;">Challenge progress</div>
        <span class="mono" style="font-size:13px;">${daysDone}/60 days</span>
      </div>
      <div class="progress-track" style="margin-bottom:8px;">
        <div class="progress-fill" style="width:${pct}%;"></div>
      </div>
      <div class="row">
        <span class="faint" style="font-size:12px;">${pct}% complete</span>
        <span class="faint" style="font-size:12px;">${60 - s.currentDay + 1} days left</span>
      </div>
    </div>

    <!-- STANDING -->
    <div class="card">
      <div class="section-title" style="margin-bottom:12px;">Your standing</div>
      <div class="row" style="margin-bottom:16px;">
        <div>
          <div class="mono" style="font-size:22px; font-weight:700; color:var(--mint);">Top ${s.cohortPercentile}%</div>
          <div class="faint" style="font-size:11px;">of ${s.cohortSize} in ${s.track}</div>
        </div>
        <div style="font-size:34px;">🏅</div>
      </div>
      <div class="section-title" style="margin-bottom:10px;">Badges</div>
      ${earnedBadges.length === 0 ? `
        <p style="font-size:12.5px;">No badges yet — your first one unlocks the moment you submit Day 1.</p>
      ` : `
        <div style="display:flex; flex-wrap:wrap; gap:8px;">
          ${s.badges.map(b => `
            <span class="chip ${b.earned ? 'on' : ''}" style="${b.earned ? '' : 'opacity:0.4;'}">
              ${b.earned ? '✓' : '○'} ${b.label}
            </span>`).join('')}
        </div>
      `}
    </div>

    <div class="footer">
      <span>ABTalks © 2026</span>
      <a href="../">Landing page</a>
    </div>
  `;

  renderStrip(document.getElementById('strip'), data.days, s.currentDay, 60);
});
</script>
</body>
</html>
