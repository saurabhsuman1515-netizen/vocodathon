<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Day 12 — ABTalks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../assets/style.css">
</head>
<body>

<nav class="nav">
  <a href="../../dashboard/" class="row" style="gap:8px; color:var(--text-muted); font-size:13px;">
    <span class="mono">←</span> Dashboard
  </a>
  <div class="mono chip on" id="ember-chip" style="display:none;">🔥 <span id="ember-count">0</span></div>
</nav>

<main class="shell" style="position:relative; z-index:1; padding-top:20px;" id="app"></main>

<script src="../../assets/app.js"></script>
<script>
const el = document.getElementById('app');
const STORAGE_KEY = 'abtalks_day12_submission';

function loadSubmission() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || null; }
  catch { return null; }
}
function saveSubmission(obj) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(obj));
}

function isValidUrl(v) {
  try { const u = new URL(v); return /^https?:$/.test(u.protocol); } catch { return false; }
}

loadData().then(data => {
  const s = data.student;
  const day = data.day12;
  const dayEntry = data.days.find(d => d.day === day.day);
  const isMissedSaved = dayEntry?.status === 'missed-saved';
  let submission = loadSubmission();

  if (s.embers > 0) {
    document.getElementById('ember-chip').style.display = 'inline-flex';
    document.getElementById('ember-count').textContent = s.embers;
  }

  render();

  function render() {
    const submitted = !!submission;
    el.innerHTML = `
      <div style="margin-bottom:18px;">
        <div class="row" style="margin-bottom:10px;">
          <div class="eyebrow" style="margin:0;">Day ${day.day} of 60 · ${day.track}</div>
          <span class="chip">${day.difficulty} · ${day.estTime}</span>
        </div>
        <h1 style="font-size:21px; line-height:1.25;">${day.title}</h1>
      </div>

      ${isMissedSaved ? `
        <div class="card" style="margin-bottom:16px; border-color:var(--mint);">
          <p style="font-size:12.5px; color:var(--text-primary);"><strong>🔥→🛡️ Ember shield covered a missed day earlier this run.</strong> Your streak stayed alive. You have ${s.embers} left.</p>
        </div>
      ` : ''}

      <div class="card" style="margin-bottom:14px;">
        <div class="section-title">The brief</div>
        <p style="font-size:13.5px; margin-bottom:16px;">${day.description}</p>

        <div class="section-title">Requirements</div>
        <ul style="margin:0 0 16px; padding-left:18px; display:flex; flex-direction:column; gap:8px;">
          ${day.requirements.map(r => `<li style="font-size:13px; color:var(--text-primary);">${r}</li>`).join('')}
        </ul>

        <div class="section-title">Hints</div>
        <ul style="margin:0 0 16px; padding-left:18px; display:flex; flex-direction:column; gap:6px;">
          ${day.hints.map(h => `<li style="font-size:12.5px; color:var(--text-muted);">${h}</li>`).join('')}
        </ul>

        <a href="${day.resource.url}" target="_blank" rel="noopener" class="btn btn-ghost btn-sm">${day.resource.label} ↗</a>
      </div>

      <!-- SUBMISSION -->
      <div class="card" id="submit-card">
        <div class="row" style="margin-bottom:14px;">
          <div class="section-title" style="margin:0;">Proof of work</div>
          ${submitted ? '<span class="chip" style="background:var(--mint-dim); border-color:var(--mint); color:#c9fff2;">✓ locked in</span>' : ''}
        </div>

        ${submitted ? renderSubmitted(submission) : renderForm()}
      </div>

      <div class="footer">
        <span>ABTalks © 2026</span>
        <a href="../../dashboard/">Back to dashboard</a>
      </div>
    `;

    if (!submitted) wireForm();
  }

  function renderForm() {
    return `
      <form id="proof-form" class="stack" style="gap:14px;">
        <div>
          <label class="mono" style="font-size:11px; color:var(--text-faint); display:block; margin-bottom:6px;">GITHUB COMMIT / REPO URL</label>
          <input type="url" id="gh-url" placeholder="https://github.com/you/repo/commit/..." required
            style="width:100%; padding:13px 14px; background:var(--bg-elevated); border:1px solid var(--border); border-radius:var(--radius-s); color:var(--text-primary); font-size:13.5px;" />
          <div class="faint" id="gh-error" style="font-size:11.5px; margin-top:5px; color:var(--danger); display:none;">That doesn't look like a valid link. Paste the full commit or repo URL.</div>
        </div>
        <div>
          <label class="mono" style="font-size:11px; color:var(--text-faint); display:block; margin-bottom:6px;">LINKEDIN POST URL</label>
          <input type="url" id="li-url" placeholder="https://linkedin.com/posts/..." required
            style="width:100%; padding:13px 14px; background:var(--bg-elevated); border:1px solid var(--border); border-radius:var(--radius-s); color:var(--text-primary); font-size:13.5px;" />
          <div class="faint" id="li-error" style="font-size:11.5px; margin-top:5px; color:var(--danger); display:none;">Add the link to your LinkedIn post about today's build.</div>
        </div>
        <p style="font-size:11.5px;">Both links go live on your public profile. Submitting locks Day ${day.day} and moves your streak to <strong style="color:var(--text-primary);">${s.streak + 1}</strong>.</p>
        <button type="submit" class="btn btn-primary">Submit and lock streak →</button>
      </form>
    `;
  }

  function renderSubmitted(sub) {
    return `
      <div class="stack" style="gap:10px;">
        <a href="${sub.gh}" target="_blank" rel="noopener" class="row card" style="padding:12px 14px; margin:0;">
          <span style="font-size:13px;">📦 GitHub proof</span>
          <span class="mono faint" style="font-size:11px;">open ↗</span>
        </a>
        <a href="${sub.li}" target="_blank" rel="noopener" class="row card" style="padding:12px 14px; margin:0;">
          <span style="font-size:13px;">💼 LinkedIn proof</span>
          <span class="mono faint" style="font-size:11px;">open ↗</span>
        </a>
      </div>
      <p style="font-size:12px; margin-top:12px;">Streak now at <strong style="color:var(--ember);">${s.streak + 1} days</strong>. Day ${day.day + 1} unlocks after midnight.</p>
    `;
  }

  function wireForm() {
    document.getElementById('proof-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const gh = document.getElementById('gh-url').value.trim();
      const li = document.getElementById('li-url').value.trim();
      let ok = true;
      document.getElementById('gh-error').style.display = isValidUrl(gh) ? 'none' : 'block';
      document.getElementById('li-error').style.display = isValidUrl(li) ? 'none' : 'block';
      if (!isValidUrl(gh) || !isValidUrl(li)) ok = false;
      if (!ok) return;

      submission = { gh, li, at: new Date().toISOString() };
      saveSubmission(submission);
      showToast('Day ' + day.day + ' locked in — streak extended', { icon: '🔥' });
      render();
    });
  }
});
</script>
</body>
</html>
